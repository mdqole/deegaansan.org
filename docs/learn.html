<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your Deegansan course room: weekly modules, live sessions, quizzes and assignments." />
  <title>Course Room – Deegansan</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html#home">
      <img src="images/logo.jpeg" alt="Deegansan Logo" />
    </a>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#programs">Thematic Areas</a></li>
      <li><a href="index.html#events">World Days</a></li>
      <li><a href="index.html#topics">Topics</a></li>
      <li><a href="index.html#courses">Courses</a></li>
      <li><a href="index.html#gallery">Gallery</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li id="navAuthSlot"></li>
    </ul>
  </nav>

  <main class="room-page">
    <div class="room-inner">
      <a class="back-link" href="dashboard.html">← All courses</a>

      <div id="roomMessage" class="course-not-found" hidden>
        <h2 id="roomMessageTitle"></h2>
        <p id="roomMessageText"></p>
        <a class="btn-donate-big" id="roomMessageLink" href="dashboard.html">Back to Courses →</a>
      </div>

      <div id="roomContent" hidden>
        <span class="section-tag">Course Room</span>
        <h1 id="roomTitle"></h1>
        <p class="enrolled-banner" id="roomStatus"></p>

        <div id="roomWeeks"></div>

        <section class="course-section" id="roomAssessment"></section>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <span>© 2025 Deegansan. All rights reserved.</span>
      <span>Local Actions, Global Impact.</span>
    </div>
  </footer>

  <script src="js/courses-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/learn.js"></script>

</body>
</html>
