<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to your Deegansan account to access your enrolled courses." />
  <title>Log In – Deegansan</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html#home">
      <img src="images/logo.jpeg" alt="Deegansan Logo" />
    </a>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#programs">Thematic Areas</a></li>
      <li><a href="index.html#events">World Days</a></li>
      <li><a href="index.html#topics">Topics</a></li>
      <li><a href="index.html#courses">Courses</a></li>
      <li><a href="index.html#gallery">Gallery</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li id="navAuthSlot"></li>
    </ul>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <span class="section-tag">Welcome Back</span>
      <h1>Log In</h1>
      <div class="divider"></div>

      <form class="enroll-form" id="loginForm">
        <input type="email" name="email" placeholder="Email Address" required />
        <input type="password" name="password" placeholder="Password" required />
        <button class="btn-send" type="submit">Log In →</button>
        <p class="form-status" id="authStatus"></p>
      </form>

      <div class="resend-verification" id="resendVerification" hidden>
        <button type="button" class="course-enroll-btn" id="resendVerificationBtn">Resend Verification Email</button>
      </div>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <span>© 2025 Deegansan. All rights reserved.</span>
      <span>Local Actions, Global Impact.</span>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
