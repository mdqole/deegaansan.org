<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your enrolled Deegansan courses and materials." />
  <title>My Courses – Deegansan</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html#home">
      <img src="images/logo.jpeg" alt="Deegansan Logo" />
    </a>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#programs">Thematic Areas</a></li>
      <li><a href="index.html#events">World Days</a></li>
      <li><a href="index.html#topics">Topics</a></li>
      <li><a href="index.html#courses">Courses</a></li>
      <li><a href="index.html#gallery">Gallery</a></li>
      <li><a href="index.html#contact">Contact</a></li>
      <li id="navAuthSlot"></li>
    </ul>
  </nav>

  <main class="browse-page">
    <div class="browse-inner">

      <div class="browse-head">
        <div>
          <span class="section-tag">Course Browser</span>
          <h1 id="dashboardGreeting">Courses</h1>
        </div>
        <input type="search" id="browseSearch" class="browse-search" placeholder="What do you want to learn?" aria-label="Search courses" />
      </div>

      <div class="browse-toolbar">
        <div class="browse-chips" id="browseChips">
          <button type="button" class="browse-chip active" data-filter="all">All <span class="browse-chip-count" id="countAll">0</span></button>
          <button type="button" class="browse-chip" data-filter="mine">My Courses <span class="browse-chip-count" id="countMine">0</span></button>
          <button type="button" class="browse-chip" data-filter="available">Available <span class="browse-chip-count" id="countAvailable">0</span></button>
        </div>
        <label class="browse-sort">Sort:
          <select id="browseSort">
            <option value="default">Recommended</option>
            <option value="az">Title A–Z</option>
            <option value="recent">Recently enrolled</option>
          </select>
        </label>
      </div>

      <p class="form-status" id="browseStatus"></p>

      <div id="browseGrid" class="browse-grid">
        <p class="topics-empty">Loading courses…</p>
      </div>

    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <span>© 2025 Deegansan. All rights reserved.</span>
      <span>Local Actions, Global Impact.</span>
    </div>
  </footer>

  <script src="js/courses-data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
